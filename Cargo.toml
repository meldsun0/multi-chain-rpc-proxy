[package]
name = "rpc_proxy_meldsun0"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde_json = "1.0.140"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
getset = "0.1"
dashmap = "5"
log = "0.4.27"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rand = "0.8"
anyhow = "1.0"
derive-new = "0.5"
async-trait = "0.1"
url = "2.5.4"
blake3 = "1"
thiserror = "1.0"
env_logger = "0.11"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dev-dependencies]
tempfile = "3.8"

